<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabCtrl Privacy Policy</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f8fb; line-height: 1.65; }
    main { box-sizing: border-box; width: min(100% - 32px, 920px); margin: 0 auto; padding: 48px 0 72px; }
    article { padding: 36px; border: 1px solid #e4e9f2; border-radius: 16px; background: #fff; box-shadow: 0 18px 50px rgba(23, 32, 51, 0.08); }
    nav { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; color: #5f6d80; font-size: 14px; }
    nav a { color: #2563eb; text-decoration: none; }
    nav a[aria-current="page"] { color: #172033; font-weight: 700; }
    h1, h2, h3 { line-height: 1.25; }
    h1 { margin: 0 0 18px; font-size: 34px; }
    h2 { margin: 34px 0 12px; font-size: 22px; }
    h3 { margin: 24px 0 10px; font-size: 18px; }
    p { margin: 0 0 14px; }
    ul { margin: 0 0 18px 22px; padding: 0; }
    li { margin: 4px 0; }
    table { width: 100%; margin: 18px 0 24px; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; border: 1px solid #dce3ee; text-align: left; vertical-align: top; }
    th { background: #f0f4f9; }
    code { padding: 0.12em 0.32em; border-radius: 5px; background: #eef3f8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.92em; }
    hr { margin: 32px 0; border: 0; border-top: 1px solid #e1e7f0; }
    blockquote { margin: 0 0 20px; padding-left: 14px; border-left: 4px solid #8fb4ff; color: #5f6d80; }
    @media (max-width: 640px) { main { width: min(100% - 20px, 920px); padding: 24px 0 48px; } article { padding: 22px; border-radius: 12px; } nav { justify-content: flex-start; } h1 { font-size: 28px; } table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Language">
      <a href="./" aria-current="page">English</a>
      <span>/</span>
      <a href="./zh/">中文</a>
    </nav>
    <article>

    </article>
  </main>
</body>
</html>
